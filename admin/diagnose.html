<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico de Conexión — Omikika B&B</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #3b82f6; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    pre {
      background: #0f172a;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.05);
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Diagnóstico de Integración Supabase</h1>
  <div class="card">
    <h3>Verificando API del Backend Local...</h3>
    <button onclick="runDiagnose()" style="background:#3b82f6; border:none; color:#fff; padding:0.65rem 1.25rem; border-radius:6px; font-weight:600; cursor:pointer;">
      Ejecutar Diagnóstico en Caliente
    </button>
    <div id="results" style="margin-top: 1.5rem;">
      <p style="color:#94a3b8;">Haz clic en el botón para consultar el estado del servidor.</p>
    </div>
  </div>

  <script>
    async function runDiagnose() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p>Consultando backend...</p>';
      try {
        const res = await fetch('/api/admin/diagnose');
        const data = await res.json();
        
        resultsDiv.innerHTML = `
          <p><strong>URL de Supabase:</strong> <code>${data.supabaseUrl}</code></p>
          <p><strong>Clave de Acceso Configurada:</strong> ${data.keyExists ? '<span class="status success">SÍ</span>' : '<span class="status error">NO</span>'}</p>
          
          <div style="margin-top:1rem;">
            <p><strong>Prueba Tabla Habitaciones (rooms):</strong></p>
            <pre>${data.roomsTest}</pre>
          </div>
          
          <div style="margin-top:1rem;">
            <p><strong>Prueba Tabla Reservas (reservations):</strong></p>
            <pre>${data.reservationsTest}</pre>
          </div>
          
          <div style="margin-top:1rem;">
            <p><strong>Prueba Tabla Consultas (inquiries):</strong></p>
            <pre>${data.inquiriesTest}</pre>
          </div>
        `;
      } catch (err) {
        resultsDiv.innerHTML = `<p class="status error">Fallo de Red: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
