<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador — Omikika B&B</title>
  <link rel="shortcut icon" href="../assets/img/fav.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/img/logo.png" alt="Omikika B&B">
      <h2 style="font-size: 1.25rem; margin-top: 1rem; color: #fff;">Panel de Administración</h2>
    </div>

    <div id="error-alert" class="alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="admin@omikika.cl" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary-block">Iniciar Sesión</button>
    </form>
  </div>

  <script type="module">
    import { setAuthSession, getAuthToken, getApiUrl } from './js/auth.js';

    // Redirigir si ya tiene sesión activa
    if (getAuthToken()) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verificando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(getApiUrl('/api/admin/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Credenciales no válidas.');
        }

        setAuthSession(data.token, data.user);
        window.location.href = 'index.html';

      } catch (err) {
        if (err.name === 'TypeError' || err.message.includes('fetch') || err.message.includes('NetworkError')) {
          errorAlert.textContent = 'No se pudo conectar con el servidor API local (puerto 3000). Asegúrate de tener ejecutando "npm run dev" en la terminal.';
        } else {
          errorAlert.textContent = err.message;
        }
        errorAlert.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
